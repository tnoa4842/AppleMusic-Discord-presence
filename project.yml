name: AppleMusicDiscordPresence

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: 5.0
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
    CLANG_CXX_LANGUAGE_STANDARD: c++20

targets:
  AppleMusicDiscordPresence:
    type: application
    platform: iOS

    sources:
      - path: App

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID}
        DISCORD_APP_ID: ${DISCORD_APP_ID}
        SWIFT_OBJC_BRIDGING_HEADER: App/AppleMusicDiscordPresence-Bridging-Header.h

        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/Vendor/include"

        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/Vendor/discord_partner_sdk.xcframework/ios-arm64"
          - "$(BUILT_PRODUCTS_DIR)"

        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-lc++"

    info:
      path: App/Info.plist

    dependencies:
      - framework: Vendor/discord_partner_sdk.xcframework
        embed: true
